name: gamedock
services:
  portal:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD in .env}
      DATABASE: /data/gamedock.sqlite
      GAMEDOCK_NAMESPACE: ${GAMEDOCK_NAMESPACE:-${COMPOSE_PROJECT_NAME:-gamedock}}
    volumes:
      - gamedock-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/catalog')",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
volumes:
  gamedock-data:
