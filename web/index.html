<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameDock</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/assets/notifications.css" />
    <script src="/assets/theme.js" defer></script>
    <script src="/assets/notifications.js" defer></script>
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/" class="brand"
        ><img class="brand-logo" alt="" hidden /><span
          class="mark"
          aria-hidden="true"
          >▦</span
        ><span id="brand" data-platform-name>GameDock</span></a
      >
      <div id="identity">
        <button id="refresh" class="secondary library-refresh" aria-label="Refresh instances" title="Refresh instances" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5" /><path d="M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 17.9 17" /></svg>
        </button>
      </div>
    </header>
    <main>
      <section class="intro" hidden>
        <div>
          <p class="caption">Game library</p>
          <h1 id="headline">GameDock</h1>
          <p id="banner">Your library. Your desktop. Ready to play.</p>
        </div>
        <img id="intro-banner" class="intro-banner" alt="" hidden />
        <div class="desktop-art" aria-hidden="true">
          <div class="window">
            <i></i><i></i><i></i>
            <div>▶</div>
          </div>
          <span>A space for every player</span>
        </div>
      </section>
      <div id="notice"></div>
      <section id="auth">
        <form id="auth-form">
          <h2>Sign in to your library</h2>
          <label
            >Username<input
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="32"
              pattern="[a-zA-Z0-9_-]+" /></label
          ><label
            >Password<input
              type="password"
              name="password"
              autocomplete="current-password"
              minlength="10"
              maxlength="256"
              required
          /></label>
          <label id="invite-field" hidden
            >Invitation code (for new accounts)<input
              name="invite"
              autocomplete="off"
              maxlength="128"
          /></label>
          <div class="actions">
            <button type="submit">Sign in</button
            ><button type="button" id="register" class="secondary">
              Create account
            </button>
          </div>
        </form>
        <p>
          Launch a game and return to it from your browser. Each account keeps
          its own files.
        </p>
      </section>
      <section id="library" aria-label="Game library" hidden>
        <div id="games" class="games"></div>
        <h2>Your instances</h2>
        <div id="instances"></div>
      </section>
    </main>
    <footer>
      <strong data-platform-name>GameDock</strong
      ><span id="footer-message">Game desktops under your control.</span>
    </footer>
  </body>
</html>
