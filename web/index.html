<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GameDock</title>
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="/assets/theme.js" defer></script>
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <header>
      <a href="/" class="brand"
        ><img class="brand-logo" alt="" hidden /><span
          class="mark"
          aria-hidden="true"
          >▦</span
        ><span id="brand" data-platform-name>GameDock</span></a
      >
      <div id="identity"></div>
    </header>
    <main>
      <section class="intro">
        <div>
          <p class="caption">Game library</p>
          <h1 id="headline">GameDock</h1>
          <p id="banner">Your library. Your desktop. Ready to play.</p>
        </div>
        <img id="intro-banner" class="intro-banner" alt="" hidden />
        <div class="desktop-art" aria-hidden="true">
          <div class="window">
            <i></i><i></i><i></i>
            <div>▶</div>
          </div>
          <span>A space for every player</span>
        </div>
      </section>
      <p id="notice" role="status" aria-live="polite"></p>
      <section id="auth">
        <form id="auth-form">
          <h2>Sign in to your library</h2>
          <label
            >Username<input
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="32"
              pattern="[a-zA-Z0-9_-]+" /></label
          ><label
            >Password<input
              type="password"
              name="password"
              autocomplete="current-password"
              minlength="10"
              maxlength="256"
              required
          /></label>
          <label id="invite-field" hidden
            >Invitation code (for new accounts)<input
              name="invite"
              autocomplete="off"
              maxlength="128"
          /></label>
          <div class="actions">
            <button type="submit">Sign in</button
            ><button type="button" id="register" class="secondary">
              Create account
            </button>
          </div>
        </form>
        <p>
          Launch a game and return to it from your browser. Each account keeps
          its own files.
        </p>
      </section>
      <section id="library" hidden>
        <div class="section-title">
          <h2>Choose where to play</h2>
          <button id="refresh" class="secondary">Refresh instances</button>
        </div>
        <div id="games" class="games"></div>
        <h2>Your instances</h2>
        <div id="instances"></div>
      </section>
    </main>
    <footer>
      <strong data-platform-name>GameDock</strong
      ><span id="footer-message">Game desktops under your control.</span>
    </footer>
  </body>
</html>
